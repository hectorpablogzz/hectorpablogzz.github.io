    <script>
      // Apply the theme before first paint to avoid a light/dark flash.
      try {
        const t = localStorage.getItem('theme')
        document.documentElement.dataset.theme =
          t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      } catch {}
    </script>
